services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: bef, POSTGRES_PASSWORD: bef, POSTGRES_DB: bef }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    ports: ["8000:8000"]
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg2://bef:bef@db/bef
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
volumes:
  pgdata:
